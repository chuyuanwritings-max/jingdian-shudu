  b.mistakes = Math.max(0, C.RULES.maxMistakes - 1);

// 主角是一块放大的数字方块，站在一束光里（不加手、不加角色）。一张新图都不用出：方块、光阵底、棋盘截图全部代码画，
// 画在离屏画布上当「图」交给过场播放器（cutscene.js）。
// 有四段：开场（第一次打开）、学完一课、升档学新招、通关第二段。局内「某个数填完」和通关第一段在 scene_play 里原地做。
const P = require('./platform.js');
const ui = require('./ui.js');
const C = require('./config.js');
const S = require('./sudoku.js');
const store = require('./store.js');
const { createCutscene } = require('./cutscene.js');

const AMBER = { body: '#E0B040', edge: '#B0902E', ink: '#3A2A08' };
const GOLD = { body: '#E9C25A', edge: '#A9832A', ink: '#3A2A08' };
const DARKT = { body: '#1A2422', edge: '#0B100F', ink: '#5B6B66' };
const GREY = { body: '#3A3F45', edge: '#22262A', ink: '#A7AEB6' };
const PAPER = '#F3EAD2';
const DARK = { cy: 0.45, inner: 0.22, outer: 0.62, strength: 0.8 };

module.exports = function (app) {
  // ---------- 代码画的「图」 ----------
  // 一块大方块：面 + 厚边 + 顶上一条高光；上面写字 / 打勾 / 刻档位杠
  function tileImg(size, pal, opts) {
    opts = opts || {};
    const d = app.dpr, thick = Math.round(size * 0.07), pad = Math.round(size * 0.06);
    const w = size + pad * 2, h = size + thick + pad * 2;
    const c = P.makeCanvas(Math.round(w * d), Math.round(h * d));
    const g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    const r = size * 0.14;
    ui.fillRR(g, pad + 2, pad + thick + 4, size, size, r, 'rgba(0,0,0,0.35)');
    ui.fillRR(g, pad, pad + thick, size, size, r, pal.edge);
    ui.fillRR(g, pad, pad, size, size, r, pal.body);
    ui.fillRR(g, pad + size * 0.1, pad + size * 0.05, size * 0.8, Math.max(2, size * 0.035), 2, 'rgba(255,255,255,0.4)');
    const cx = pad + size / 2, cy = pad + size / 2;
    if (opts.text) ui.text(g, opts.text, cx, cy + size * 0.02 - (opts.bars ? size * 0.06 : 0), size * (opts.text.length > 2 ? 0.24 : opts.text.length === 2 ? 0.34 : 0.56), pal.ink, 'center', 700);
    if (opts.check) ui.icons.check(g, cx, cy - (opts.bars ? size * 0.08 : 0), size * 0.5, pal.ink, Math.max(3, size * 0.06));
    if (opts.bars) {
      // 档位杠：入门 1 道 … 大师 6 道，刻在方块下沿
      // 扁扁的短横杠，一道一道排开（像军衔），不要像感叹号
      const n = opts.bars, bw = size * (n > 3 ? 0.09 : 0.13), gap = size * 0.035, tot = n * bw + (n - 1) * gap;
      for (let i = 0; i < n; i++) ui.fillRR(g, cx - tot / 2 + i * (bw + gap), pad + size * 0.83, bw, size * 0.035, 1.5, pal.ink);
    }
    return c;
  }
  // 光阵底：16 瓣放射纹（两种深浅，取当前主题彩色块的颜色），上面压一层很淡的九宫格线。代替戴夫的「比喻换底」
  const raysCache = {};
  function raysImg(th) {
    const key = th.id + '|' + app.dpr;
    if (raysCache[key]) return raysCache[key];
    const s = 512, d = app.dpr, c = P.makeCanvas(s * d, s * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    const a = (th.tileB || [th.primary, th.text])[0], b = (th.tileB || [th.primary, th.text])[1];
    g.fillStyle = b; g.fillRect(0, 0, s, s);
    g.fillStyle = a;
    for (let i = 0; i < 16; i += 2) {
      const a0 = (i / 16) * Math.PI * 2, a1 = ((i + 1) / 16) * Math.PI * 2;
      g.beginPath(); g.moveTo(s / 2, s / 2); g.lineTo(s / 2 + Math.cos(a0) * s, s / 2 + Math.sin(a0) * s); g.lineTo(s / 2 + Math.cos(a1) * s, s / 2 + Math.sin(a1) * s); g.closePath(); g.fill();
    }
    g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 2;
    for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo((s * i) / 3, 0); g.lineTo((s * i) / 3, s); g.moveTo(0, (s * i) / 3); g.lineTo(s, (s * i) / 3); g.stroke(); }
    raysCache[key] = c;
    return c;
  }
  // 一行七个小点，第 lit 个（0 起）亮琥珀，前面学过的亮白
  function dotsImg(done, lit) {
    const d = app.dpr, w = 7 * 22, h = 16, c = P.makeCanvas(w * d, h * d), g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    for (let i = 0; i < 7; i++) {
      g.beginPath(); g.arc(11 + i * 22, 8, i === lit ? 6.5 : 5, 0, Math.PI * 2);
      g.fillStyle = i === lit ? AMBER.body : done[i] ? 'rgba(243,234,210,0.85)' : 'rgba(243,234,210,0.22)';
      g.fill();
    }
    return c;
  }

  // ---------- 播放 ----------
  // 简洁动效 / 黑板主题：去掉震屏、全屏闪压低（主页与过场设计 2.2 第 5、8 条）
  function tame(tl) {
    const reduce = store.data.settings.reduceMotion;
    const cap = app.th.id === 'chalk' ? C.CUT.flashChalk : C.CUT.flashMax;
    const beats = tl.beats.map((b) => Object.assign({}, b, {
      fx: (b.fx || []).filter((f) => !(reduce && (f.fx === 'shake' || f.fx === 'strobe' || (f.fx === 'camera' && f.steps)))).map((f) => {
        if (f.fx === 'flash' && !f.paper) return Object.assign({}, f, { alpha: reduce ? Math.min(f.alpha || 0.7, 0.25) : Math.min(f.alpha || 0.7, cap) });
        return f;
      }),
    }));
    return Object.assign({}, tl, { beats });
  }
  // 播一段：盖在当前画面上（播放器每帧整屏涂底），点一下跳过；播完 onEnd
  app.playCut = (timeline, images, opts) => {
    opts = opts || {};
    const short = !!opts.short || store.data.settings.reduceMotion;
    let ended = false, last = P.now();
    const cs = createCutscene({
      ctx: app.ctx, width: app.W, height: app.H, images, timeline: tame(timeline), short,
      onSfx: (name) => {
        if (name === 'dong' || name === 'lamp') app.buzz('heavy');
        app.sound(name, name === 'hum' ? 0.35 : undefined);
      },
      onEnd: () => setTimeout(finish, 0),
    });
    const ov = {
      cut: true,
      live: () => !ended,
      draw(ctx, t) {
        cs.update(Math.max(0, t - last));
        last = t;
        cs.draw();
        ui.button({ id: 'cs-skip', x: 0, y: 0, w: app.W, h: app.H, silent: true, onDown: () => cs.skip() });
      },
    };
    function finish() {
      if (ended) return;
      ended = true;
      const i = app.overlays.indexOf(ov);
      if (i >= 0) { app.overlays.splice(i, 1); app.redraw(); }
      if (opts.onEnd) opts.onEnd();
    }
    app.push(ov);
    ov.t0 = P.now() - 1000; // 不要淡入：过场自己管画面
    return cs;
  };

  // ---------- 开场：游戏名亮相（第一次打开，2.6 秒）----------
  // 黑 → 暗方块淡入（对准主页图里亮的那一块）→ 呼吸 → 「啪」亮成琥珀 + 白闪里硬切成主页图 → 镜头拉回 → 游戏名弹出
  app.cutOpen = (onEnd) => {
    // 主页图（Midjourney）是异步加载的：先黑屏等它（最多 2.5 秒），开场才对得准亮的那一块，播完也接得上同一张图
    const HA = require('./homeart.js');
    let waiting = true;
    const black = { cut: true, live: () => waiting, draw(ctx) { ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, app.W, app.H); } };
    app.push(black);
    black.t0 = P.now() - 1000;
    HA.whenReady(app.W, app.H, app.dpr, () => {
      waiting = false;
      const i = app.overlays.indexOf(black);
      if (i >= 0) app.overlays.splice(i, 1);
      playOpen(HA, onEnd);
    }, 2500); // 微信里图在包内，几乎瞬间到；网页版走网络，多等一会儿
  };
  function playOpen(HA, onEnd) {
    const art = HA.get(app.W, app.H, app.dpr);
    const L = art.lit, W = app.W, H = app.H;
    const tsz = Math.round(L.s * 1.05);
    const images = { home: art.canvas, dark: tileImg(tsz, DARKT), lit: tileImg(tsz, AMBER) };
    const pos = [L.x / W, L.y / H], hh = (images.dark.height / app.dpr) / H;
    const tl = {
      id: 'open', fps: 60, bg: '#000000',
      layers: [
        { id: 'home', img: 'home', fit: 'cover', z: 0, visible: false },
        { id: 'tile', img: 'dark', z: 1, pos, anchor: [0.5, 0.5], h: hh, alpha: 0 },
      ],
      beats: [
        { id: 'black', type: 'hold', dur: 12 },
        { id: 'dark-in', type: 'darkIn', dur: 24, tracks: [{ layer: 'tile', prop: 'alpha', from: 0, to: 1, dur: 24, ease: 'out' }], fx: [{ at: 0, sfx: 'hum' }] },
        { id: 'hold', type: 'hold', dur: 40, tracks: [{ layer: 'tile', prop: 'scale', from: 1, to: 1.02, ease: 'breathe' }],
          fx: [{ at: 0, fx: 'glow', origin: pos, r0: 14, r1: 18, dur: 40, color: AMBER.body, z: 0.5 }] },
        { id: 'strike', type: 'strike', dur: 3, frames: [{ f: 0, layer: 'tile', smear: { sx: 1.12, sy: 0.82, lines: 6 } }, { f: 2, layer: 'tile', img: 'lit' }] },
        { id: 'impact', type: 'impact', dur: 15,
          frames: [{ f: 0, layer: 'home', visible: true }, { f: 0, layer: 'tile', visible: false }],
          fx: [{ at: 0, fx: 'flash', alpha: 0.7, decay: 15 }, { at: 0, fx: 'shake', amp: 4, dur: 8 },
               { at: 0, fx: 'camera', steps: [1.08, 1.18, 1.3], stepDur: 3, focus: pos },
               { at: 0, fx: 'particles', preset: 'spark', n: 16, origin: pos, z: 3 }, { at: 0, sfx: 'lamp' }] },
        { id: 'pose', type: 'pose', dur: 60,
          fx: [{ at: 0, fx: 'camera', to: 1, dur: 40, ease: 'out', focus: pos },
               { at: 10, fx: 'text', str: app.TITLE, in: 'pop', pos: [0.5, app.titleY / H], size: 44, color: HA.colors().title, stroke: 'rgba(0,0,0,0)', dur: 50 },
               { at: 10, sfx: 'bell9' }, { at: 0, fx: 'particles', preset: 'dust', n: 8, z: 4, dur: 60 }] },
      ],
    };
    store.data.seen.open = true;
    store.save();
    return app.playCut(tl, images, { onEnd });
  }

  // ---------- 学完一课（1.5 秒，短版 0.8 秒）----------
  // 压暗 → 停 → 写着课号的方块从上面砸到正中 → 咚 → 七个小点第 n 个点亮 +「学会了 · 排除法」→ 纸色一闪
  app.cutLesson = (index, name, opts) => {
    const th = app.th, H = app.H, W = app.W;
    const pal = th.tileB ? { body: th.tileB[0], edge: th.tileB[1], ink: th.tileB[2] } : AMBER;
    const done = require('./tutorial.js').BASIC.map((L) => !!store.data.lessons[L.id]); // 基础 3 课 3 个点
    const before = done.slice(); before[index] = false;
    const sz = Math.round(Math.min(W * 0.42, 170));
    const images = { tile: tileImg(sz, opts && opts.all ? GOLD : pal, { text: opts && opts.all ? '全会' : String(index + 1) }), dotsA: dotsImg(before, -1), dotsB: dotsImg(done, index) };
    const hh = (images.tile.height / app.dpr) / H;
    const tl = {
      id: 'lesson', fps: 60, bg: '#0E0E0E', vignette: DARK, short: { from: 'strike', dur: { pose: 24 } },
      layers: [
        { id: 'tile', img: 'tile', z: 2, pos: [0.5, 0.44], anchor: [0.5, 0.5], h: hh, visible: false },
        { id: 'dots', img: 'dotsA', z: 2, pos: [0.5, 0.62], anchor: [0.5, 0.5], h: 16 / H, visible: false },
      ],
      beats: [
        { id: 'darken', type: 'drop', dur: 2 },
        { id: 'hold', type: 'hold', dur: 20, fx: [{ at: 0, fx: 'glow', origin: [0.5, 0.44], r0: 6, r1: 10, dur: 20, color: AMBER.body, z: 1 }] },
        { id: 'strike', type: 'strike', dur: 3,
          frames: [{ f: 0, layer: 'tile', visible: true, pos: [0.5, 0.26], smear: { sx: 0.9, sy: 1.3, lines: 4 } }, { f: 2, layer: 'tile', pos: [0.5, 0.44] }] },
        { id: 'impact', type: 'impact', dur: 15,
          frames: [{ f: 0, layer: 'dots', visible: true }],
          tracks: [{ layer: 'tile', prop: 'sy', from: 0.84, to: 1, dur: 10, ease: 'pop' }, { layer: 'tile', prop: 'sx', from: 1.1, to: 1, dur: 10, ease: 'pop' }],
          fx: [{ at: 0, fx: 'flash', alpha: 0.5, decay: 12 }, { at: 0, fx: 'shake', amp: 4, dur: 6 },
               { at: 0, fx: 'particles', preset: 'spark', n: 14, origin: [0.5, 0.5], z: 3 }, { at: 0, sfx: 'dong' }] },
        { id: 'pose', type: 'pose', dur: 45,
          frames: [{ f: 6, layer: 'dots', img: 'dotsB' }],
          fx: [{ at: 6, fx: 'text', str: opts && opts.all ? '七招全会' : '学会了 · ' + name, in: 'pop', pos: [0.5, 0.72], size: 24, color: PAPER, stroke: 'rgba(0,0,0,0)', dur: 39 },
               { at: 6, sfx: 'bell9' }] },
        { id: 'out', type: 'out', dur: 6, fx: [{ at: 0, fx: 'flash', color: th.bg, alpha: 1, hold: 2, decay: 4, paper: true }] },
      ],
    };
    return app.playCut(tl, images, opts);
  };

  // ---------- 升档学新招（3.5 秒，短版 1.1 秒）----------
  // 旧档方块站在光里 → 呼吸 → 上方聚能 → 新档方块砸下 → 咚 + 推镜 → 光环扫一圈外扩 → 光柱慢转「中等 · 新招：区块排除」
  app.cutTier = (tier, lessonName, opts) => {
    const th = app.th, H = app.H, W = app.W;
    const top = tier === 5;
    const pal = top ? GOLD : th.tileB ? { body: th.tileB[0], edge: th.tileB[1], ink: th.tileB[2] } : AMBER;
    const sz = Math.round(Math.min(W * 0.42, 170));
    const images = { old: tileImg(sz, GREY, { bars: tier }), neu: tileImg(sz, pal, { bars: tier + 1 }) };
    const hh = (images.old.height / app.dpr) / H;
    const tl = {
      id: 'tier', fps: 60, bg: '#0A0A0A', vignette: DARK, short: { from: 'strike', drop: ['ring'], dur: { pose: 36 } },
      layers: [
        { id: 'old', img: 'old', z: 2, pos: [0.5, 0.5], anchor: [0.5, 0.5], h: hh, alpha: 0 },
        { id: 'neu', img: 'neu', z: 3, pos: [0.5, 0.5], anchor: [0.5, 0.5], h: hh, visible: false },
      ],
      beats: [
        { id: 'dark-in', type: 'darkIn', dur: 24, tracks: [{ layer: 'old', prop: 'alpha', from: 0, to: 1, dur: 24, ease: 'out' }] },
        { id: 'hold', type: 'hold', dur: 36, tracks: [{ layer: 'old', prop: 'scale', from: 1, to: 1.02, ease: 'breathe' }],
          fx: [{ at: 0, fx: 'glow', origin: [0.5, 0.6], r0: 14, r1: 18, dur: 36, color: AMBER.body, z: 1 }] },
        { id: 'charge', type: 'charge', dur: 40,
          fx: [{ at: 0, fx: 'glow', origin: [0.5, 0.22], r0: 8, r1: 60, grow: 40, dur: 40, color: AMBER.body, z: 4 },
               { at: 0, fx: 'strobe', pattern: [2, 6, 1, 8], min: 0, max: 0.6, local: [0.5, 0.22, 0.25], dur: 40 }, { at: 0, sfx: 'hum' }] },
        { id: 'strike', type: 'strike', dur: 3,
          frames: [{ f: 0, layer: 'neu', visible: true, pos: [0.5, 0.24], smear: { sx: 0.9, sy: 1.3, lines: 6 } }, { f: 2, layer: 'neu', pos: [0.5, 0.5] }] },
        { id: 'impact', type: 'impact', dur: 18,
          fx: [{ at: 0, fx: 'flash', alpha: 0.7, decay: 15 }, { at: 0, fx: 'shake', amp: 6, dur: 8 },
               { at: 0, fx: 'particles', preset: 'spark', n: 28, origin: [0.5, 0.5], z: 5 }, { at: 0, fx: 'star', origin: [0.5, 0.5], size: 0.12, z: 5 },
               { at: 0, fx: 'camera', steps: [1.08, 1.18, 1.3], stepDur: 3, focus: [0.5, 0.5] }, { at: 0, sfx: 'dong' }] },
        { id: 'swap', type: 'swap', dur: 2, frames: [{ f: 0, layer: 'old', visible: false }, { f: 0, layer: 'neu', scale: 1.15 }],
          fx: [{ at: 0, fx: 'camera', to: 1, dur: 0, focus: [0.5, 0.5] }] },
        { id: 'ring', type: 'ring', dur: 30, fx: [{ at: 0, fx: 'ring', origin: [0.5, 0.52], rx: 0.36, ry: 0.07, dur: 30, expand: true, z: 4 }, { at: 0, sfx: 'whoosh' }] },
        { id: 'pose', type: 'pose', dur: 50,
          fx: [{ at: 0, fx: 'rays', origin: [0.5, 0.5], z: 1, fadeIn: 10, alpha: 0.26, color: top ? GOLD.body : AMBER.body, dur: 50 },
               { at: 8, fx: 'text', str: top ? '大师' : S.TIERS[tier].name, in: 'pop', pos: [0.5, 0.74], size: 34, color: PAPER, stroke: 'rgba(0,0,0,0)', dur: 42 },
               { at: 14, fx: 'text', str: lessonName ? '新招：' + lessonName : '新的一档', in: 'fade', pos: [0.5, 0.8], size: 16, color: 'rgba(243,234,210,0.75)', stroke: 'rgba(0,0,0,0)', dur: 36 },
               { at: 8, sfx: 'chord' }] },
        { id: 'out', type: 'out', dur: 8, fx: [{ at: 0, fx: 'flash', color: th.bg, alpha: 1, hold: 3, decay: 5, paper: true }] },
      ],
    };
    return app.playCut(tl, images, opts);
  };

  // ---------- 通关第二段（第一段在棋盘上：顿、金色波浪、长停）----------
  // 整盘 3 帧压扁收成一块大金方块 → 咚 + 推镜 → 光阵底「完成！」→ 结束后直接硬切到安静的结算页（反差回落）
  app.cutWin = (boardShot, geo, tier, head, sub, opts) => {
    const th = app.th, H = app.H, W = app.W;
    const sz = Math.round(Math.min(W * 0.46, 180));
    const images = { board: boardShot, gold: tileImg(sz, GOLD, { check: true, bars: tier + 1 }), rays: raysImg(th) };
    const bpos = [(geo.x + geo.size / 2) / W, (geo.y + geo.size / 2) / H];
    const tl = {
      id: 'win', fps: 60, bg: '#0E0E0E', short: { from: 'strike', dur: { pose: C.CUT.win.poseShort } },
      layers: [
        { id: 'rays', img: 'rays', fit: 'cover', z: 0, visible: false },
        { id: 'board', img: 'board', z: 2, pos: bpos, anchor: [0.5, 0.5], h: geo.size / H },
        { id: 'gold', img: 'gold', z: 3, pos: [0.5, 0.45], anchor: [0.5, 0.5], h: (images.gold.height / app.dpr) / H, visible: false },
      ],
      beats: [
        { id: 'strike', type: 'strike', dur: 3,
          frames: [{ f: 0, layer: 'board', smear: { sx: 1.1, sy: 0.6, lines: 8 } }, { f: 2, layer: 'board', visible: false }, { f: 2, layer: 'gold', visible: true }] },
        { id: 'impact', type: 'impact', dur: 18,
          fx: [{ at: 0, fx: 'flash', alpha: 0.7, decay: 15 }, { at: 0, fx: 'shake', amp: 6, dur: 8 },
               { at: 0, fx: 'particles', preset: 'spark', n: 28, origin: [0.5, 0.45], z: 5 }, { at: 0, fx: 'star', origin: [0.5, 0.45], size: 0.12, z: 5 },
               { at: 0, fx: 'camera', steps: [1.08, 1.18, 1.3], stepDur: 3, focus: [0.5, 0.45] }, { at: 0, sfx: 'dong' }] },
        { id: 'pose', type: 'pose', dur: 60,
          frames: [{ f: 0, layer: 'rays', visible: true }],
          tracks: [{ layer: 'rays', prop: 'scale', from: 1, to: 1.08, dur: 60, ease: 'linear' }],
          fx: [{ at: 0, fx: 'camera', to: 1, dur: 10, ease: 'out', focus: [0.5, 0.45] },
               { at: 8, fx: 'text', str: head, in: 'pop', pos: [0.5, 0.71], size: 40, color: PAPER, stroke: 'rgba(0,0,0,0.35)', strokeWidth: 6, dur: 52 },
               { at: 12, fx: 'text', str: sub, in: 'fade', pos: [0.5, 0.78], size: 16, color: PAPER, stroke: 'rgba(0,0,0,0.35)', strokeWidth: 4, dur: 48 },
               { at: 0, fx: 'particles', preset: 'dust', n: 20, z: 4, dur: 60 }, { at: 8, sfx: 'chord' }] },
      ],
    };
    return app.playCut(tl, images, opts);
  };

  app.cutTileImg = tileImg;
};

});
__def("js/cutscene.js", function (module, exports, require) {
// 通用过场播放器 1.0（2026-11-21，拆《潜水员戴夫》过场后写）
// 只用 canvas 2D，不碰 DOM：微信小游戏 require 进来就能用，浏览器 <script> 也能用。
// 时间单位是「帧」（60fps 基准）；真机掉帧时按毫秒补帧，不拖慢。坐标全部 0～1 归一化，横竖屏通用。
// 用法：
//   const { createCutscene } = require('./cutscene.js');
//   const cs = createCutscene({ ctx, width: 375, height: 667, images, timeline, short: false,
//                               onEnd() {}, onSfx(name) {} });
//   每帧：cs.update(dtMs); cs.draw();   点屏幕：cs.skip();
// 时间线格式见 00_过场动画制作_技能_1.0.md 第 5 节。
(function (root) {
  'use strict';

  // ---------- 缓动 ----------
  const EASE = {
    linear: t => t,
    in: t => t * t,
    out: t => 1 - (1 - t) * (1 - t),
    inOut: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    sine: t => 0.5 - 0.5 * Math.cos(Math.PI * t),
    step: t => (t < 1 ? 0 : 1),
    pop: t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }, // 弹过头再回来
  };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  // 一些随机数要可重复（同一段过场每次播一样），用固定种子
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  }

  // ---------- 粒子预设 ----------
  const PARTICLE = {
    spark:  { colors: ['#FFE07A', '#FFB030', '#FF7A1A'], speed: [3, 9], gravity: 0.25, life: [18, 36], size: [2, 3.5], shape: 'line' },
    debris: { colors: ['#9A9A9A', '#6E6E6E', '#C8C0B0'], speed: [3, 8], gravity: 0.35, life: [40, 70], size: [3, 6], shape: 'rect' },
    hearts: { colors: ['#FF5A7A', '#FFFFFF', '#E8204A'], speed: [0.4, 1.2], gravity: -0.02, life: [90, 150], size: [8, 16], shape: 'heart', area: true },
    bokeh:  { colors: ['#FFFFFF', '#FFE0F0', '#FFF4C0'], speed: [0.2, 0.6], gravity: -0.01, life: [80, 140], size: [6, 18], shape: 'dot', area: true, alpha: 0.5 },
    dust:   { colors: ['#FFFFFF'], speed: [0.2, 0.8], gravity: 0, life: [60, 120], size: [1.5, 3], shape: 'dot', area: true, alpha: 0.6 },
  };

  function createCutscene(opts) {
    const ctx = opts.ctx;
    const W = opts.width, H = opts.height;
    const tl = opts.timeline;
    const fps = tl.fps || 60;
    const images = opts.images || {};
    const onEnd = opts.onEnd || (() => {});
    const onSfx = opts.onSfx || (() => {});
    const rand = rng(tl.seed || 7);

    // 短版（第二次起播）：从 short.from 开始，去掉 short.drop 里的节拍，short.dur 里的节拍改时长
    const S = opts.short ? (tl.short || (tl.shortFrom ? { from: tl.shortFrom } : null)) : null;
    let defs = tl.beats, pre = [];
    if (S) {
      const i0 = Math.max(0, tl.beats.findIndex(b => b.id === S.from));
      pre = tl.beats.slice(0, i0);
      defs = tl.beats.slice(i0).filter(b => !(S.drop || []).includes(b.id))
        .map(b => (S.dur && S.dur[b.id] ? Object.assign({}, b, { dur: S.dur[b.id], repeat: 1 }) : b));
    }

    // 把 repeat 展开成平铺的节拍表，记下每个节拍的起始帧
    const beats = [];
    let total = 0;
    for (const b of defs) {
      const n = b.repeat || 1;
      for (let k = 0; k < n; k++) {
        beats.push({ def: b, start: total, k });
        total += b.dur;
      }
    }

    // 图层状态
    const layers = {};
    const base = {};
    for (const L of tl.layers) {
      const s = {
        id: L.id, img: L.img, z: L.z || 0, anchor: L.anchor || [0.5, 0.5], fit: L.fit || null,
        x: (L.pos || [0.5, 0.5])[0], y: (L.pos || [0.5, 0.5])[1], h: L.h || 0.5,
        scale: 1, sx: 1, sy: 1, alpha: L.alpha == null ? 1 : L.alpha, rot: 0,
        visible: L.visible !== false, flipX: false, smear: null,
      };
      layers[L.id] = s;
      base[L.id] = Object.assign({}, s);
    }

    let frame = 0;          // 当前帧
    let acc = 0;            // 毫秒累计
    let done = false;
    let beatIdx = -1;
    const active = [];      // 正在播的特效
    const tracks = [];      // 正在走的补间
    let cycle = null;       // 连打
    const cam = { scale: 1, fx: 0.5, fy: 0.5, anim: null };

    // ---------- 节拍进入：起补间、换图、开特效 ----------
    function enterBeat(i, silent) {
      const { def, start } = typeof i === 'number' ? beats[i] : i;
      if (def.reset) resetToBase(def.reset);
      for (const t of def.tracks || []) {
        const L = layers[t.layer];
        if (!L) continue;
        const from = t.from == null ? L[t.prop] : t.from;
        tracks.push({ L, prop: t.prop, from, to: t.to, start: start + (t.at || 0), dur: t.dur || def.dur,
                      ease: t.ease || 'linear', yoyo: t.ease === 'breathe' });
      }
      cycle = def.cycle ? Object.assign({ start, last: -1, order: [] }, def.cycle) : null;
      if (silent) {
        // 短版快进：只落最终状态，不放特效
        for (const f of def.frames || []) applyFrame(f);
        for (const t of tracks) if (t.prop !== 'scale' || !t.yoyo) t.L[t.prop] = t.yoyo ? t.from : t.to;
        tracks.length = 0;
        if (def.camera) cam.scale = def.camera.to || 1;
        return;
      }
    }

    function resetToBase(mode) {
      // 反差回落：所有特效同帧清零，回到第一张图
      active.length = 0;
      tracks.length = 0;
      cycle = null;
      cam.scale = 1; cam.anim = null; cam.fx = 0.5; cam.fy = 0.5;
      if (mode === 'all' || mode === true) {
        for (const id in layers) Object.assign(layers[id], base[id]);
      }
    }

    function applyFrame(f) {
      const L = layers[f.layer];
      if (!L) return;
      if (f.img) L.img = f.img;
      if (f.visible != null) L.visible = f.visible;
      if (f.flipX != null) L.flipX = f.flipX;
      if (f.pos) { L.x = f.pos[0]; L.y = f.pos[1]; }
      if (f.alpha != null) L.alpha = f.alpha;
      if (f.scale != null) L.scale = f.scale;
      L.smear = f.smear || null;
    }

    function startFx(spec, beatStart) {
      const fx = Object.assign({}, spec, { t0: beatStart + (spec.at || 0) });
      switch (fx.fx) {
        case 'particles': {
          const P = PARTICLE[fx.preset] || PARTICLE.spark;
          fx.parts = [];
          const n = fx.n || 20;
          const ox = (fx.origin || [0.5, 0.5])[0] * W, oy = (fx.origin || [0.5, 0.5])[1] * H;
          for (let k = 0; k < n; k++) {
            const a = fx.angle != null ? fx.angle + (rand() - 0.5) * (fx.spread || Math.PI * 2)
                                       : rand() * Math.PI * 2;
            const sp = lerp(P.speed[0], P.speed[1], rand());
            fx.parts.push({
              x: P.area ? rand() * W : ox, y: P.area ? rand() * H : oy,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (P.area ? 0 : 1.5),
              life: Math.round(lerp(P.life[0], P.life[1], rand())), size: lerp(P.size[0], P.size[1], rand()),
              color: P.colors[(rand() * P.colors.length) | 0], rot: rand() * 6.28, vr: (rand() - 0.5) * 0.4,
            });
          }
          fx.P = P;
          fx.dur = fx.dur || Math.max(...fx.parts.map(p => p.life));
          break;
        }
        case 'camera':
          cam.anim = { t0: fx.t0, steps: fx.steps, stepDur: fx.stepDur || 3, from: cam.scale, to: fx.to,
                       dur: fx.dur || 0, ease: fx.ease || (fx.steps ? 'step' : 'out') };
          if (fx.focus) { cam.fx = fx.focus[0]; cam.fy = fx.focus[1]; }
          return; // 不进 active
        case 'sfx':
          onSfx(fx.name);
          return;
      }
      if (fx.fx === 'speedlines' || fx.fx === 'rays') fx.seed = (rand() * 1e9) | 0;
      active.push(fx);
    }

    // ---------- 每帧推进 ----------
    function stepFrame() {
      // 进入新节拍
      while (beatIdx + 1 < beats.length && frame >= beats[beatIdx + 1].start) {
        beatIdx++;
        enterBeat(beatIdx, false);
      }
      const b = beats[beatIdx];
      if (b) {
        const local = frame - b.start;
        for (const f of b.def.frames || []) if (f.f === local) applyFrame(f);
        for (const s of b.def.fx || []) {
          if ((s.at || 0) === local) {
            if (s.sfx) onSfx(s.sfx);
            if (s.fx) startFx(s, b.start);
          }
        }
        if (cycle) stepCycle(local);
      }
      // 补间
      for (let i = tracks.length - 1; i >= 0; i--) {
        const t = tracks[i];
        const p = (frame - t.start) / t.dur;
        if (p < 0) continue;
        if (t.yoyo) { t.L[t.prop] = lerp(t.from, t.to, 0.5 - 0.5 * Math.cos(Math.PI * 2 * p)); if (p >= 1) t.L[t.prop] = t.from; }
        else t.L[t.prop] = lerp(t.from, t.to, (EASE[t.ease] || EASE.linear)(clamp(p, 0, 1)));
        if (p >= 1) tracks.splice(i, 1);
      }
      // 镜头
      if (cam.anim) {
        const a = cam.anim, lt = frame - a.t0;
        if (a.steps) {
          const k = Math.min(Math.floor(lt / a.stepDur), a.steps.length - 1);
          if (lt >= 0) cam.scale = a.steps[k];
          if (lt >= a.steps.length * a.stepDur) cam.anim = null;
        } else if (a.dur) {
          cam.scale = lerp(a.from, a.to, (EASE[a.ease] || EASE.out)(clamp(lt / a.dur, 0, 1)));
          if (lt >= a.dur) cam.anim = null;
        } else { cam.scale = a.to; cam.anim = null; }
      }
      // 粒子物理、过期特效
      for (let i = active.length - 1; i >= 0; i--) {
        const fx = active[i];
        const lt = frame - fx.t0;
        if (fx.parts) for (const p of fx.parts) { p.x += p.vx; p.y += p.vy; p.vy += fx.P.gravity; p.rot += p.vr; p.vx *= 0.985; }
        const life = fxLife(fx);
        if (life != null && lt > life) active.splice(i, 1);
      }
      frame++;
      if (frame >= total && !done) finish();
    }

    function fxLife(fx) {
      switch (fx.fx) {
        case 'flash': return (fx.hold || 0) + (fx.decay || 15);
        case 'shake': return fx.dur || 8;
        case 'star': return fx.dur || 14;
        case 'sweat': return fx.dur || 50;
        default: return fx.dur == null ? null : fx.dur;   // null = 一直到节拍被 reset 或过场结束
      }
    }

    function stepCycle(local) {
      const c = cycle;
      const slot = Math.floor(local / (c.every || 3));
      if (slot === c.last) return;
      c.last = slot;
      const L = layers[c.layer];
      if (!L) return;
      // 乱序但不连着两次同一张；镜像和小位移冒充更多张
      let k;
      do { k = (rand() * c.imgs.length) | 0; } while (c.imgs.length > 1 && c.imgs[k] === L.img);
      L.img = c.imgs[k];
      L.flipX = c.mirror ? rand() < 0.4 : false;
      const j = c.jitter || 0;
      L.x = (c.pos || base[c.layer].pos || [base[c.layer].x, base[c.layer].y])[0] + (rand() - 0.5) * j * 2;
      L.y = (c.pos || [base[c.layer].x, base[c.layer].y])[1] + (rand() - 0.5) * j;
    }

    function finish() {
      done = true;
      onEnd();
    }

    // ---------- 绘制 ----------
    function drawLayer(L) {
      if (!L.visible || L.alpha <= 0) return;
      const img = images[L.img];
      if (!img) return;
      ctx.save();
      ctx.globalAlpha = clamp(L.alpha, 0, 1);
      let dw, dh;
      if (L.fit === 'cover') {
        const s = Math.max(W / img.width, H / img.height) * L.scale;
        dw = img.width * s; dh = img.height * s;
      } else {
        dh = L.h * H * L.scale; dw = dh * img.width / img.height;
      }
      const px = L.x * W, py = L.y * H;
      ctx.translate(px, py);
      if (L.rot) ctx.rotate(L.rot);
      let sx = L.sx * (L.flipX ? -1 : 1), sy = L.sy;
      if (L.smear) {
        // 抹帧：拉伸 + 速度线，不用另外出图
        sx *= L.smear.sx || 2.4; sy *= L.smear.sy || 0.8;
        drawSmearLines(L, dw, dh);
      }
      ctx.scale(sx, sy);
      ctx.drawImage(img, -dw * L.anchor[0], -dh * L.anchor[1], dw, dh);
      ctx.restore();
    }

    function drawSmearLines(L, dw, dh) {
      const n = L.smear.lines || 8;
      const dir = L.smear.dir || 1;          // 1 = 从左往右冲，速度线留在左边
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = L.smear.color || '#FFFFFF';
      ctx.lineWidth = 2;
      const r = rng(frame * 31 + 5);
      for (let k = 0; k < n; k++) {
        const y = (r() - 0.5) * dh * 0.9 - dh * (L.anchor[1] - 0.5);
        const len = dw * (0.8 + r() * 1.4);
        ctx.beginPath();
        ctx.moveTo(-dir * dw * 0.4, y);
        ctx.lineTo(-dir * (dw * 0.4 + len), y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 世界里的特效（跟镜头一起缩放），按 z 插进图层之间
    function drawWorldFx(fx) {
      const lt = frame - fx.t0;
      const o = fx.origin || [0.5, 0.5];
      const ox = o[0] * W, oy = o[1] * H;
      ctx.save();
      switch (fx.fx) {
        case 'glow': {     // 聚能：光点由小变大
          const p = clamp(lt / (fx.grow || fx.dur || 40), 0, 1);
          const r = lerp(fx.r0 || 4, fx.r1 || 60, EASE.in(p)) * (1 + 0.08 * Math.sin(lt * 0.9));
          const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, r);
          g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.3, fx.color || '#9FF4FF'); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, r, 0, 6.29); ctx.fill();
          break;
        }
        case 'rays': {     // 放射光柱，慢转
          const n = fx.n || 12, len = Math.max(W, H) * 1.2;
          const a0 = lt * (fx.spin == null ? 0.004 : fx.spin);
          const fade = fx.fadeIn ? clamp(lt / fx.fadeIn, 0, 1) : 1;
          ctx.globalAlpha = (fx.alpha || 0.35) * fade;
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = fx.color || '#FFD27A';
          for (let k = 0; k < n; k++) {
            const a = a0 + k * Math.PI * 2 / n, w = (fx.width || 0.09);
            ctx.beginPath(); ctx.moveTo(ox, oy);
            ctx.lineTo(ox + Math.cos(a - w) * len, oy + Math.sin(a - w) * len);
            ctx.lineTo(ox + Math.cos(a + w) * len, oy + Math.sin(a + w) * len);
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'speedlines': {   // 集中线：从四周指向中心，每 2 帧换一次
          const r = rng(fx.seed + Math.floor(lt / 2));
          const n = fx.n || 40, R = Math.hypot(W, H) * 0.6;
          ctx.strokeStyle = fx.color || '#FFFFFF';
          ctx.globalAlpha = fx.alpha || 0.8;
          for (let k = 0; k < n; k++) {
            const a = r() * Math.PI * 2, inner = R * (fx.inner || 0.45) * (0.8 + r() * 0.4);
            ctx.lineWidth = 1 + r() * 2.5;
            ctx.beginPath();
            ctx.moveTo(ox + Math.cos(a) * inner, oy + Math.sin(a) * inner);
            ctx.lineTo(ox + Math.cos(a) * R * 1.4, oy + Math.sin(a) * R * 1.4);
            ctx.stroke();
          }
          break;
        }
        case 'ring': {     // 光环：绕物体扫一圈；expand = 最后一圈扩出画面
          const dur = fx.dur || 30, p = clamp(lt / dur, 0, 1);
          let rx = (fx.rx || 0.42) * W, ry = (fx.ry || 0.09) * H;
          if (fx.expand) { const e = 1 + EASE.in(p) * 3.5; rx *= e; ry *= e; }
          const head = -Math.PI / 2 + p * Math.PI * 2 * (fx.expand ? 0.6 : 1);
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          for (let k = 0; k < 14; k++) {     // 一条带尾巴的弧
            const a1 = head - k * 0.12, a2 = head - (k + 1) * 0.12;
            ctx.globalAlpha = (1 - k / 14) * (fx.expand ? 1 - p * 0.6 : 1);
            ctx.strokeStyle = k < 2 ? '#FFFFFF' : (fx.color || '#5FD0FF');
            ctx.lineWidth = (fx.width || 6) * (1 - k / 20);
            ctx.beginPath(); ctx.ellipse(ox, oy, rx, ry, 0, a2, a1); ctx.stroke();
          }
          if (fx.expand) { ctx.globalAlpha = 0.5 * (1 - p); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(ox, oy, rx, ry, 0, 0, 6.29); ctx.stroke(); }
          break;
        }
        case 'star': {     // 命中星形：黄色尖角，0.6 → 1.1 后消失
          const dur = fx.dur || 14, p = clamp(lt / dur, 0, 1);
          const R = (fx.size || 0.08) * W * lerp(0.6, 1.1, EASE.out(p));
          ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
          ctx.fillStyle = fx.color || '#FFE24A'; ctx.strokeStyle = '#3A2A00'; ctx.lineWidth = 2;
          ctx.beginPath();
          const n = fx.points || 9;
          for (let k = 0; k < n * 2; k++) {
            const a = k * Math.PI / n + lt * 0.02, rr = k % 2 ? R * 0.42 : R * (0.85 + 0.3 * ((k * 37) % 5) / 5);
            ctx.lineTo(ox + Math.cos(a) * rr, oy + Math.sin(a) * rr);
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          break;
        }
        case 'sweat': {    // 汗滴：冒出来、往下滑一点、淡掉
          const dur = fx.dur || 50, p = clamp(lt / dur, 0, 1);
          const s = (fx.size || 0.025) * W;
          ctx.globalAlpha = p < 0.15 ? p / 0.15 : p > 0.75 ? (1 - p) / 0.25 : 1;
          const y = oy + p * s * 1.5;
          ctx.fillStyle = '#BFE8FF'; ctx.strokeStyle = '#2A4A66'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(ox, y - s * 1.3);
          ctx.quadraticCurveTo(ox + s, y, ox, y + s * 0.6); ctx.quadraticCurveTo(ox - s, y, ox, y - s * 1.3);
          ctx.fill(); ctx.stroke();
          break;
        }
        case 'particles': {
          const P = fx.P;
          for (const p of fx.parts) {
            if (lt > p.life) continue;
            ctx.globalAlpha = (P.alpha || 1) * (1 - lt / p.life);
            ctx.fillStyle = ctx.strokeStyle = p.color;
            if (P.shape === 'line') { ctx.lineWidth = p.size * 0.6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2); ctx.stroke(); }
            else if (P.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore(); }
            else if (P.shape === 'heart') drawHeart(p.x, p.y, p.size);
            else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 6.29); ctx.fill(); }
          }
          break;
        }
      }
      ctx.restore();
    }

    function drawHeart(x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.35);
      ctx.bezierCurveTo(x - s * 0.6, y - s * 0.1, x - s * 0.3, y - s * 0.6, x, y - s * 0.25);
      ctx.bezierCurveTo(x + s * 0.3, y - s * 0.6, x + s * 0.6, y - s * 0.1, x, y + s * 0.35);
      ctx.fill();
    }

    // 屏幕特效（不跟镜头缩放）：渐晕、闪、频闪、文字
    function drawScreenFx(fx) {
      const lt = frame - fx.t0;
      ctx.save();
      switch (fx.fx) {
        case 'flash': {
          const hold = fx.hold || 0, decay = fx.decay || 15;
          const a = lt < hold ? 1 : 1 - (lt - hold) / decay;
          ctx.globalAlpha = clamp((fx.alpha == null ? 0.6 : fx.alpha) * a, 0, 1);
          ctx.fillStyle = fx.color || '#FFFFFF';
          ctx.fillRect(0, 0, W, H);
          break;
        }
        case 'strobe': {   // pattern = 每次亮/暗各停几帧；local = 只闪局部光点（防光敏）
          const pat = fx.pattern || [2, 6];
          const cyc = pat.reduce((s, v) => s + v, 0);
          let m = lt % cyc, k = 0;

// 抖一点的粗墨线
function inkLine(g, pts, w, seed) {
  let s = seed;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  g.strokeStyle = INK;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = 0; i + 1 < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const n = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 10));
    let px = x1, py = y1;
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      const x = x1 + (x2 - x1) * t + (rnd() - 0.5) * 1.6, y = y1 + (y2 - y1) * t + (rnd() - 0.5) * 1.6;
      g.lineWidth = w * (0.75 + rnd() * 0.55);
      g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke();
      px = x; py = y;
    }
  }
}

__def("js/scene_challenge.js", function (module, exports, require) {
// 挑战卡（0.6，Cc：「优化分享和挑战页面……让一时不会的人能尽快入坑」）
//   解完一题 →「发给朋友挑战这一题」→ 微信卡片（盘面缩略图 +「我 4:12 解开了，你来试试？」）
//   朋友点开 → 直接到这一题的挑战页；第一次玩的人可以先学 30 秒规则，这一局还会带着他走前 3 步
//   做完 → 两人对比的结算页 →「发回去挑战他」
const P = require('./platform.js');
const ui = require('./ui.js');
const S = require('./sudoku.js');
const Board = require('./board.js');
const store = require('./store.js');
const bank = require('./puzzles.js');
const DB = require('./drawboard.js');

// 挑战链接：c = 档.题号.用时秒.错几次，p = 题目本身（81 位，题库以后变了也认得出）
function encode(b) {
  // 秒数往下取整，和屏幕上的计时（app.fmt）一致
  return { c: [b.tier, b.idx, Math.floor(b.elapsed / 1000), b.mistakes].join('.'), p: b.puzzle };
}
function decode(q) {
  if (!q || !q.c) return null;
  const [tier, idx, sec, mis] = String(q.c).split('.').map(Number);
  if (!(tier >= 0 && tier < 6)) return null;
  const puzzle = q.p && /^[0-9]{81}$/.test(q.p) ? q.p : bank[tier] && bank[tier][idx];
  if (!puzzle || S.countSolutions(S.decode(puzzle), 2) !== 1) return null;
  return { tier, idx, time: (sec || 0) * 1000, mistakes: mis || 0, puzzle };
}

module.exports = function (app) {
  // 挑战卡上的图：5:4（微信分享卡片的比例），盘面只画题目原有的数
  app.makeShareImage = (b, line1, line2, btn) => {
    const th = app.th, w = 500, h = 400, d = 2;
    const c = P.makeCanvas(w * d, h * d);
    const g = c.getContext('2d');
    g.setTransform(d, 0, 0, d, 0, 0);
    g.fillStyle = th.bg; g.fillRect(0, 0, w, h);
    const size = 288, geo = { x: 24, y: (h - size) / 2, size };
    const vals = S.decode(b.puzzle);
    DB.draw(g, th, geo, { vals, given: vals.map(Boolean), notes: null, wrong: () => false, selected: -1, now: 0 }, d);
    const tx = 24 + size + 20, tw = w - tx - 20;
    // line1 = [大字, 小字]：「我 04:12」/「解开了」，分两行不让它乱折
    ui.text(g, line1[0], tx, 118, 30, th.text, 'left', 800);
    ui.text(g, line1[1], tx, 160, 24, th.text, 'left', 700);
    ui.wrap(g, line2, tx, 200, tw, 15, 21, th.sub, 500);
    ui.fillRR(g, tx, 290, tw, 46, 23, th.primary);
    ui.text(g, btn || '来挑战', tx + tw / 2, 313, 18, th.primaryText, 'center', 700);
    return c;
  };

  // 发一张微信卡片：微信里直接调分享；浏览器预览弹一个分享窗，给 Cc 看朋友会收到什么，能复制链接或用手机自带的分享
  app.shareCard = (title, q, img, sheetTitle) => {
    if (P.shareToWx(title, q, P.canvasImage(img))) return null;
    const url = P.shareLink(q);
    const dataUrl = P.canvasImage(img);
    app.lastShare = { url, title, q };
    app.push({
      onBackdrop: () => app.pop(),
      draw(ctx, t, p) {
        const th = app.th;
        const hh = 470 + (app.H - app.bottom);
        const y = app.sheet(ctx, p, hh, sheetTitle || '发给朋友挑战');
        ui.text(ctx, '朋友会收到这样一张卡片：', 24, y + 66, 13, th.sub);
        // 卡片预览（直接画同一张图）
        const cw = app.W - 48, ch = cw * 0.8;
        ctx.save(); ui.rr(ctx, 24, y + 80, cw, ch, 12); ctx.clip();
        ctx.drawImage(img, 0, 0, img.width, img.height, 24, y + 80, cw, ch);
        ctx.restore();
        let by = y + 80 + ch + 14;
        if (typeof navigator !== 'undefined' && navigator.share) {
          ui.pill(ctx, th, 'share-system', 16, by, app.W - 32, 50, '用手机自带的分享发到微信', () => { P.systemShare(title, url); app.pop(); }, 'primary');
          by += 58;
        }
        ui.pill(ctx, th, 'share-copy', 16, by, app.W - 32, 46, '复制链接', () => { P.copyText(title + ' ' + url); app.pop(); app.toast('链接已复制，发给朋友吧'); }, navigator.share ? 'card' : 'primary');
      },
    });
    return dataUrl;
  };

  // 发挑战 / 发成绩：b = 我这一局。kind = 'duo'：约好一起做的那题，做完互发成绩
  app.shareChallenge = (b, isReply, kind) => {
    const tn = S.TIERS[b.tier].name;
    // 用时先不说（Cc：「她做完成功之后，才看得到我的时间」）：做完这一题才揭晓
    const title = kind === 'duo' ? '约好一起做的那题，我做完了！你做完就能看到我的用时'
      : isReply ? '我也解开了这题，该你了（做完才看得到我的用时）' : '我解开了这题「' + tn + '」数独，你来试试？做完才看得到我的用时';
    const img = app.makeShareImage(b, kind === 'duo' ? ['我做完了', '约好的那一题'] : ['我解开了', '这一题'], '「' + tn + '」数独\n做完才揭晓我的用时');
    return app.shareCard(title, encode(b), img, kind === 'duo' ? '把成绩发给他' : '发给朋友挑战');
  };

  // ---------- 朋友点开 ----------
  let ch = null;
  app.openChallenge = (q) => {
    const c = decode(q);
    if (!c) return false;
    ch = c;
    const mine = (store.data.finished || {})[c.puzzle], cur = store.data.current;
    if (mine) {
      // 这一题我已经做完了（比如约好一起做、或者朋友把成绩发回来）：直接两人并排比，不用再做一遍
      app.go('result', { board: { mode: 'challenge', tier: c.tier, idx: c.idx, puzzle: c.puzzle, elapsed: mine.time, mistakes: mine.mistakes, score: mine.score || 0, revives: 0, challenge: { time: c.time, mistakes: c.mistakes }, compareOnly: true } });
    } else if (cur && !cur.done && cur.puzzle === c.puzzle) {
      // 这一题我正在做：把朋友的成绩挂上，做完就揭晓
      cur.challenge = { time: c.time, mistakes: c.mistakes };
      store.save();
      app.continueGame();
      setTimeout(() => app.toast('朋友做完了！\n你做完这一题就能看到他的用时', 2600), 300);
    } else app.go('challenge');
    return true;
  };

        const p = S.PEERS[c].find((x) => grid[x] === v && U.indexOf(x) < 0);
        if (p === undefined) return;
        let dir = S.ROW(p) === S.ROW(c) ? 'row' : S.COL(p) === S.COL(c) ? 'col' : 'box';
        const key = p + dir;
        (rays[key] = rays[key] || { p, dir, cs: [] }).cs.push(c);
      });
      Object.keys(rays).forEach((key, i) => {
        const R = rays[key], t0 = at + i * 130 * sp;
        items.push({ kind: 'ring', k: R.p, t0 });
        if (R.dir === 'box') {
          items.push({ kind: 'zone', cells: R.cs, t0: t0 + 80 * sp, dur: 420 * sp });
          R.cs.forEach((c) => items.push({ kind: 'x', k: c, t0: t0 + 160 * sp }));
        } else {
          // 光从挡路的那个数出发，一直扫到这一单元里最远的那一格
          const far = R.cs.reduce((m, c) => (Math.abs(S.ROW(c) - S.ROW(R.p)) + Math.abs(S.COL(c) - S.COL(R.p)) > Math.abs(S.ROW(m) - S.ROW(R.p)) + Math.abs(S.COL(m) - S.COL(R.p)) ? c : m), R.cs[0]);
          const len = Math.abs(S.ROW(far) - S.ROW(R.p)) + Math.abs(S.COL(far) - S.COL(R.p));
          const dur = (120 + len * 28) * sp;
          items.push({ kind: 'ray', a: R.p, b: far, t0, dur });
          R.cs.forEach((c) => { const d = Math.abs(S.ROW(c) - S.ROW(R.p)) + Math.abs(S.COL(c) - S.COL(R.p)); items.push({ kind: 'x', k: c, t0: t0 + dur * (d / Math.max(1, len)) }); });
        }

      let i = 0;
      for (let d = 1; d <= 9; d++) {
        if (d === v) continue;

        if (p === undefined) continue;

  }
  // 「这里放不了」：格子压灰 + 一道灰斜线。不用红叉——Cc：「人一看到那个叉叉，就感觉填错了」
  function blocked(ctx, k, a) {
    if (a <= 0) return;
    const r = DB.cellRect(geo, k), th = app.th;
    ctx.globalAlpha = 0.16 * a; ctx.fillStyle = th.text; ctx.fillRect(r.x, r.y, r.s + 0.5, r.s + 0.5);

  function drawChain(ctx, t) {

  }

  // ---------- 开局演示：先在这盘上一步一步讲本局那一招，讲完让你自己填 ----------
  // Cc：「这个特效第一次教的时候，还是得慢慢解释怎么排除出来的吧」→ 不再一口气闪完：
  // 棋盘下面一张讲解卡，一次一句话 + 棋盘上画这一步的东西；点「下一步」才往下走；讲的时候计时停着
  let demo = null; // { k, v, t0 } 手指指着、等你填的那一格
  let teach = null; // { stages: [{ ch, text, items }], i, ts, k, v }
  function startDemo(narrate) {
    const f = b.focus;
    if (!f) return false;
    const grid = Board.rightGrid(b);
    // 挑一格讲得清的：中间不夹别的招（all = 用到的推理全在 chain 里），每个叉都指得出是哪个数挡的（lone = 0）
    // 先看本局那几处关键格，再看盘上别的空格；都不够干净就挑最干净的
    let best = null;
    const cells = []; for (let k = 0; k < 81; k++) cells.push(k);
    const order = f.keys.concat(cells.filter((k) => f.keys.indexOf(k) < 0));
    for (const k of order) {
      if (grid[k]) continue;
      const v = +b.sol[k], ex = S.explain(grid.slice(), k, v);
      if (!ex || ex.show !== f.name) continue;
      const stages = teachStages(k, v, ex, grid);
      const bad = stages.lone + (ex.all - ex.chain.length) * 10;
      if (!best || bad < best.bad) best = { k, v, stages, bad };
      if (!bad) break;
    }
    if (!best) return false;
    demo = null; fx.chain = null; b.selected = -1;
    teach = { stages: best.stages, i: 0, ts: P.now(), k: best.k, v: best.v, bad: best.bad };
    SK.say(narrate || '我一步一步讲「' + f.name + '」～', 'happy', 2200);
    app.animate(1500);
    return true;
  }
  const UN = (u) => (u < 9 ? '这一行' : u < 18 ? '这一列' : '这一宫');
  const dist = (a, c) => Math.abs(S.ROW(a) - S.ROW(c)) + Math.abs(S.COL(a) - S.COL(c));
  // 挡住这些格子的 v（不在 unit 里的那个），找不到的（被前面的招删掉的）直接压灰
  function rayItems(grid, cells, v, unit, t0, tally) {
    const items = [], byP = {}, lone = [];
    cells.forEach((c) => {
      const p = S.PEERS[c].find((x) => grid[x] === v && S.UNITS[unit].indexOf(x) < 0);
      if (p === undefined) lone.push(c); else (byP[p] = byP[p] || []).push(c);
    });
    Object.keys(byP).forEach((ps, i) => {
      const p = +ps, at = t0 + i * 450;
      items.push({ kind: 'ring', k: p, t0: at });
      byP[p].forEach((c) => { const dur = 220 + dist(p, c) * 70; items.push({ kind: 'ray', a: p, b: c, t0: at + 150, dur }); items.push({ kind: 'x', k: c, t0: at + 150 + dur }); });
    });
    lone.forEach((c) => items.push({ kind: 'x', k: c, t0: t0 }));
    if (tally) tally.lone += lone.length;
    return items;
  }
  function teachStages(k, v, ex, grid) {
    const stages = [], crossed = new Set(), tally = { lone: 0 };
    const empty = (u, but) => S.UNITS[u].filter((c) => !grid[c] && (!but || but.indexOf(c) < 0));
    ex.chain.forEach((st, ci) => {
      const ch = 'c' + ci, d = st.digit, n = st.focus.length;
      const elimX = st.elim.map((e) => ({ kind: 'x', k: e.k, t0: 200, keep: true }));
      st.elim.forEach((e) => crossed.add(e.k));
      if (st.tech === 'pointing' || st.tech === 'claiming') {
        const A = st.unit, B = st.unit2; // 先看 A（宫 / 行），v 只在 A 和 B 重叠的那几格；所以 B 里别的格子不能放 v
        stages.push({ ch, text: '先看' + UN(A) + '：别处的 ' + d + ' 把压灰的空格都挡住了', items: [{ kind: 'zone', cells: S.UNITS[A], t0: 0 }].concat(rayItems(grid, empty(A, st.focus), d, A, 300, tally)) });
        stages.push({ ch, text: UN(A) + '的 ' + d + ' 只能在标出来的这 ' + n + ' 格\n它们正好都在' + UN(B) + '里', items: [{ kind: 'zone', cells: S.UNITS[B], t0: 0, dim: true }].concat(st.focus.map((c, i) => ({ kind: 'ghost', k: c, v: d, t0: 150 + i * 150 }))) });
        stages.push({ ch, text: '所以 ' + d + ' 一定在这 ' + n + ' 格里\n' + UN(B) + '别的格子都不能放 ' + d + ' 了', items: st.focus.map((c) => ({ kind: 'ghost', k: c, v: d, t0: 0 })).concat(elimX) });
      } else if (st.digits && st.focus.length === 2) {

        stages.push({ ch, text: naked ? '看这两格：都只能填 ' + a + ' 或 ' + c2 : '看' + UN(U) + '：' + a + ' 和 ' + c2 + ' 都只能放在这两格', items: [{ kind: 'zone', cells: st.focus, t0: 0 }].concat(st.focus.map((c, i) => ({ kind: 'ghost', k: c, v: a + ' ' + c2, t0: 200 + i * 150 }))) });
        stages.push({ ch, text: naked ? a + ' 和 ' + c2 + ' 被这两格占定了\n' + UN(U) + '别的格子不能再填它们' : '这两格被 ' + a + '、' + c2 + ' 占定了\n不能再填别的数', items: [{ kind: 'zone', cells: S.UNITS[U], t0: 0, dim: true }].concat(elimX) });
      } else {
        stages.push({ ch, text: '先看亮着的格子：它们挡住了压灰的地方', items: [{ kind: 'zone', cells: st.focus || st.cells, t0: 0 }].concat(elimX) });

      stages.push({ ch, text: (ex.chain.length ? '再看' : '看') + UN(U) + '：' + v + ' 能放哪？\n别处的 ' + v + ' 顺着行、列把压灰的格子挡住了', items: [{ kind: 'zone', cells: S.UNITS[U], t0: 0 }].concat(rayItems(grid, fresh, v, U, 300, tally)) });
    } else if (fin.tech === 'nakedSingle') {
      const items = [{ kind: 'zone', cells: [k], t0: 0 }];
      let i = 0;
      for (let d = 1; d <= 9; d++) {
        if (d === v) continue;
        const p = S.PEERS[k].filter((x) => grid[x] === d).sort((a, c) => dist(a, k) - dist(c, k))[0];
        if (p === undefined) continue;

        i++;

      const gone = [];
      ex.chain.forEach((st) => st.elim.forEach((e) => { if (e.k === k) S.digits(e.m).forEach((d) => gone.indexOf(d) < 0 && gone.push(d)); }));
      tally.lone += Math.max(0, 8 - i - gone.length); // 剩下没交代的：讲不清
      stages.push({ ch, text: '看这一格：它的行、列、宫里已经有了 ' + i + ' 个不同的数（圈出来的）' + (gone.length ? '\n刚才又排除了 ' + gone.join('、') : ''), items });
    } else if (fin.tech === 'fullHouse') {
      stages.push({ ch, text: UN(fin.unit) + '只剩这一格是空的', items: [{ kind: 'zone', cells: S.UNITS[fin.unit], t0: 0 }] });
    }

    stages.push({ ch, text: fin.tech === 'nakedSingle' ? '1 到 9 只剩 ' + v + ' 没出现\n这一格只能填 ' + v + '！' : '只剩这一格能放 ' + v + '！', items: [{ kind: 'target', k, t0: 0 }] });
    return stages;
  }
  function teachNext() {
    if (!teach) return;

    const { k, v } = teach;

  function drawTeach(ctx, t) {
    if (!teach) return;
    const th = app.th, GOLD = '#FFC24A', cur = teach.stages[teach.i], e0 = t - teach.ts;
    const ctr = (k) => { const r = DB.cellRect(geo, k); return [r.x + r.s / 2, r.y + r.s / 2, r.s]; };

      if (e < 0) return;

      } else if (it.kind === 'ring') {

  // ---------- 按时间排的小事件（代替到处 setTimeout：同一时刻的事在同一帧里做）----------
  function later(ms, fn) { fx.events.push({ at: P.now() + ms, fn }); }
  function runEvents(t) {
    if (!fx.events.length) return;
    const due = fx.events.filter((e) => e.at <= t);
    if (!due.length) return;
    fx.events = fx.events.filter((e) => e.at > t);
    due.forEach((e) => e.fn(t));
  }

  // ---------- 某个数 9 个都填完：原地「顿一下再爆」（0.43 秒，不盖屏、不锁输入）----------
  // 顿（9 块硬切成金面）→ 出手（9 块同时放大 1.18，不缓动）→ 命中（各一层白光、弹回、金线串起、键上打勾、火星、棋盘轻抖、铃音）
  function digitBurst(v, land) {
    later(land - P.now() + 200, () => SK.say(v + ' 都齐啦！9 个一个不少', 'cheer', 1800));
    const D = C.CUT.digit, F = 1000 / 60;
    b.digitCount = (b.digitCount || 0) + 1;
    const full = b.digitCount === 1 && !store.data.settings.reduceMotion;
    const hold = (full ? D.hold : D.holdShort) * F, hit = (full ? D.hit : D.hitShort) * F;
    const cells = [];
    for (let x = 0; x < 81; x++) if (b.vals[x] === v) cells.push(x);
    const tS = land + hold, tH = tS + D.strike * F, tEnd = tH + hit;
    cells.forEach((x) => { fx.gold[x] = [land, tEnd]; });
    fx.digit = { cells, tS, tH, tEnd, full };
    later(tH - P.now(), (t) => {
      cells.forEach((x) => fx.flash.push({ k: x, t0: t, dur: 12 * F, color: '#FFFFFF', alpha: 0.6 }));
      cells.forEach((x) => sparkAt(x, full ? 3 : 2));
      if (full) fx.boardShake = { t0: t, dur: 6 * F, amp: 2 };
      app.sound('bell' + Math.min(8, b.digitCount));
      app.buzz('heavy'); // 9 个齐了：重重一下，再两下轻的余震
      later(70, () => app.buzz('light')); later(140, () => app.buzz('light'));
    });
    fx.keyDone[v] = tS;
    app.animate(tEnd - P.now() + 100);
  }
  // 单格缩放：数字填完的「出手」放大 → 弹回；通关长停时整盘呼吸
  function cellScale(k, t) {
    const d = fx.digit;
    if (d && t >= d.tS && t < d.tEnd && d.cells.indexOf(k) >= 0) {
      if (t < d.tH) return C.CUT.digit.scale;
      const p = Math.min(1, (t - d.tH) / (10 * 1000 / 60));
